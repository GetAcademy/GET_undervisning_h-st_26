<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Kinobillett</title>
  </head>
  <body>
    <div id="app"></div>

    <script>
      //Model

      const app = document.getElementById("app");
      let result = "";
      let ageInput = 0;
      let dayInput = "";
      let isStudent = false;

      //View
      updateView();
      function updateView() {
        app.innerHTML = /*HTML*/ `
            <h1>Kjøp kinobillett</h1>
            <div>${ticketComponent()}</div>
            <button onclick="buyTicket()">Sjekk pris</button>
            <h3>${result}</h3>
        `;
      }
      function ticketComponent() {
        return /*HTML*/ `
        <div>
              <h2>Kinobillett</h2>
              <label for="age">Alder:</label>  
              <input type="number" id="age" onchange="saveAge(this.value)">
              <br>


              <label for="day">Velg dag:</label>
              <select id="day" onchange="saveDay(this.value)">
                <option value="mandag">Mandag</option>
                <option value="tirsdag">Tirsdag</option>
                <option value="onsdag">Onsdag</option>
                <option value="torsdag">Torsdag</option>
                <option value="fredag">Fredag</option>
                <option value="lørdag">Lørdag</option>
                <option value="søndag">Søndag</option>
                </select>

                <br>
              <label>
                    <input type="checkbox" onchange="saveIsStudent(this.checked)">
                    Jeg er student
                </label>
        </div>
        `;
      }

      function buyTicket() {
        let price = getPrice(ageInput, dayInput, isStudent);

        result = `Billetten koster ${price} kr`;
        updateView();
        resetInputs();
      }
      //Controller

      function saveAge(newAge) {
        ageInput = newAge;
      }
      function saveDay(newDay) {
        dayInput = newDay;
      }
      function saveIsStudent(newIsStudent) {
        isStudent = newIsStudent;
      }

      function resetInputs() {
        ageInput = 0;
        dayInput = "";
        isStudent = false;
      }

      function getPrice(age, day, isStudent) {
        if (age < 18 || age >= 67) {
          return 100;
        }
        if (isStudent && day != "lørdag" && day != "søndag") {
          return 120;
        }
        if (day == "lørdag" || day == "søndag") {
          return 180;
        }
        return 150;
      }
    </script>
  </body>
</html>
