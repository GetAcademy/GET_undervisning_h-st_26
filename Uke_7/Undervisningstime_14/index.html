<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bestemmer hvilken tegn dokumentet skal bruke, viktig for æ,ø og å -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      width=device-width → viewporten skal følge bredden på enheten.
      initial-scale=1.0 → siden skal starte med normal zoom.
    -->
    <meta name="description" content="En nettside om HTML og CSS" />
    <!--beskriver innholdet på siden og blant annet kan brukes av søkemotorer.-->
    <title>Document</title>
    <link href="/default.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div>
      <h1>CSS og responsive design</h1>
      <h2>Dagens plan:</h2>
      <ul>
        <li>Meta tags</li>
        <li>Media queries</li>
        <li>Filfordeling med CSS</li>
        <li>CSS og DRY-prinsippet</li>
      </ul>
    </div>
  </body>
</html>
