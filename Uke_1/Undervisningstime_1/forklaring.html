<!doctype html>
<!-- Forteller nettleseren at dette er et HTML5-dokument -->

<html lang="en">
  <!-- Starter HTML-dokumentet. lang="en" sier at språket er engelsk -->

  <head>
    <!-- Inneholder informasjon OM nettsiden, som vanligvis ikke vises på selve siden -->

    <meta charset="UTF-8" />
    <!-- Gjør at nettleseren kan vise tegn som æ, ø og å riktig -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Gjør at nettsiden tilpasser seg forskjellige skjermstørrelser, som mobil og PC -->

    <title>Document</title>
    <!-- Tittelen som vises i fanen i nettleseren -->
  </head>

  <body>
    <!-- Her legger vi alt innholdet som skal vises på nettsiden -->
  </body>
</html>
<!-- Avslutter HTML-dokumentet -->
