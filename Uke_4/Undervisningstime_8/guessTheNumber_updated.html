<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Number</title>
    <style>
      body {
        background-color: rgb(45, 45, 45);
        color: white;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      input,
      button {
        font-size: 150%;
      }
    </style>
  </head>
  <body onload="init()">
    <div id="app"></div>
    <script>
      //Model
      let secretNumber;
      let guessedNumber;
      let guessCount = 0;

      //view
      updateView();
      function updateView() {
        document.getElementById("app").innerHTML = /*HTML*/ `
            <div>${getMessage()}</div>
            <div>Du har gjettet ${guessCount} ganger.</div>
            <input
                type="number"
                min="1"
                max="100"
                oninput="guessedNumber = this.valueAsNumber"
                value="${guessedNumber}"
            >
            <button onclick="guess()">Gjett</button>
            <button onclick="init()">Start på nytt</button>
            <button onclick="autoGuess()">Auto Guess</button>
    
            `;
      }

      function getMessage() {
        console.log(typeof guessedNumber);
        console.log(secretNumber);
        if (!guessedNumber) return "";
        if (guessedNumber === secretNumber) return "Riktig!";
        if (guessedNumber < secretNumber) return "For lavt!";
        return "For høyt!";
      }

      //controller

      function autoGuess() {
        // while (true) {
        //   guessCount++;
        //   guessedNumber = getRandomNumber();
        //   if (guessedNumber == secretNumber) {
        //     break;
        //   }
        // }
        while (guessedNumber != secretNumber) {
          guessCount++;
          guessedNumber = getRandomNumber();
        }
        updateView();
      }

      function getRandomNumber() {
        return Math.floor(Math.random() * 100) + 1;
      }

      function init() {
        secretNumber = getRandomNumber();
        guessedNumber = null;
        guessCount = 0;
        updateView();
      }

      function guess() {
        guessCount++;
        updateView();
      }
    </script>
  </body>
</html>
